[project]
name = "stitchslop-hermes"
version = "0.2.2"
description = "Stitch Slop for Hermes: a live pane and a bridge for the browser embroidery app"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Art-prep scripts (prep_art.py, arc_text.py) only — not installed by Hermes.
art = ["pillow>=10,<14", "numpy>=1.26,<3"]
dev = ["pillow>=10,<14", "numpy>=1.26,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
